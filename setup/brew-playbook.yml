---
- name: setup home directory
  hosts: localhost
  connection: local
  # gather_facts: false

  tasks:
      # https://stackoverflow.com/questions/32374349/how-to-create-dynamic-variables-in-ansible
      - set_fact:
            user_home_dir: "{{lookup('env', 'HOME') }}"

      - name: 'update any installed brew apps'
        ansible.builtin.shell: 'arch -{{ ansible_architecture }} brew update && brew upgrade'

      - name: 'Install apps via brew on command line'
        ansible.builtin.shell: 'arch -{{ ansible_architecture }} brew install {{ item }}'
        loop:
            - alacritty
            - ansible
            - autoconf
            - bat
            - broot
            - bruno
            - colima
            - curl
            - docker
            - docker-compose
            - eza
            - fd
            - font-jetbrains-mono-nerd-font
            - font-caskaydia-cove-nerd-font
            - font-caskaydia-mono-nerd-font
            - fzf
            - httpie
            - jq
            - lazygit
            - lua
            - lua-language-server
            - neovim
            - pandoc # for markdown preview
            - powerlevel10k
            - ripgrep
            - sqlite3
            - tmux
            - tree
            - tree-sitter
            - wget
            - zed
            - zsh-autosuggestions
            - zoxide

      - name: 'Install cask apps via brew on command line'
        ansible.builtin.shell: 'arch -{{ ansible_architecture }} brew install --cask {{ item }}'
        loop:
            - ghostty
